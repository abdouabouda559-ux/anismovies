<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول المدير - لوحة التحكم</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 2.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .login-card h2 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
      text-align: center;
    }

    .login-card p {
      color: #94a3b8;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login-form input {
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 0.8rem;
      border-radius: 8px;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }

    .login-form input:focus {
      border-color: #38bdf8;
    }

    .submit-btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: #0ea5e9;
    }

    .form-message {
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      text-align: center;
      margin-bottom: 1rem;
    }
    .form-message.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .form-message.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #94a3b8;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back-link:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>لوحة تحكم المشرف</h2>
    <p>قم بتسجيل الدخول بحساب المدير للوصول</p>
    
    <div id="loginMessage" class="form-message"></div>

    <form class="login-form" onsubmit="handleAdminLogin(event)">
      <input type="email" id="adminEmail" placeholder="البريد الإلكتروني للمدير" required>
      <input type="password" id="adminPassword" placeholder="كلمة المرور" required>
      <button type="submit" class="submit-btn">تسجيل الدخول</button>
    </form>

    <a href="../index.html" class="back-link">← العودة إلى الموقع الرئيسي</a>
  </div>

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script>
    function showMessage(msg, isSuccess = false) {
      const msgBox = document.getElementById('loginMessage');
      msgBox.innerText = msg;
      msgBox.className = 'form-message ' + (isSuccess ? 'success' : 'error');
      msgBox.style.display = 'block';
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      showMessage('جاري التحقق من الصلاحيات...', true);

      // 1. تسجيل الدخول عبر Supabase Auth
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      
      if (error) {
        showMessage(error.message, false);
        return;
      }

      const user = data.user;

      // 2. التحقق المباشر من إيميل المدير المعتمد رسمياً لحماية اللوحة بنسبة 100%
      const adminEmail = "abdouabouda559@gmail.com";

      if (user.email !== adminEmail) {
        showMessage('عذراً، لا تمتلك صلاحيات المشرف للوصول إلى لوحة التحكم.', false);
        await supabaseClient.auth.signOut();
        return;
      }

      showMessage('تم تسجيل الدخول بنجاح! جاري التوجيه للوحة التحكم...', true);
      setTimeout(() => {
        window.location.href = 'index.html'; // الانتقال لصفحة لوحة التحكم الرئيسية
      }, 1000);
    }
  </script>
</body>
</html>
