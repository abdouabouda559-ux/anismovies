<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أنيس موفيز - AnisMovies</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* تنسيقات التصميم الأصلي للموقع */
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }
    .user-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .profile-badge {
      display: none;
      align-items: center;
      gap: 10px;
      background-color: #334155;
      padding: 6px 14px;
      border-radius: 30px;
    }
    #user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
    }
    #username-display {
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }
    .auth-btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .main-content {
      padding: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">أنيس موفيز 🎬</div>
    <div class="user-section">
      <!-- حاوية اسم المستخدم وصورة البروفايل (تظهر عند تسجيل الدخول) -->
      <div id="profile-badge" class="profile-badge">
        <img id="user-avatar" src="" alt="صورة البروفايل">
        <span id="username-display">اسم المستخدم</span>
      </div>
      <!-- زر تسجيل الدخول / الخروج -->
      <button id="auth-btn" class="auth-btn" onclick="openAuthModal()">تسجيل الدخول</button>
    </div>
  </header>

  <div class="main-content">
    <h1>أهلاً بك في منصة أنيس موفيز</h1>
    <p>استمتع بمشاهدة أحدث الأفلام والمسلسلات بجودة عالية.</p>
  </div>

  <script>
    // إعدادات Supabase الخاصة بالمشروع
    const SUPABASE_URL = 'https://oebxbywghooghwetpx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // ضع مفتاح الـ Anon الخاص بك هنا
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // دالة فحص جلسة المستخدم وتحديث الهيدر تلقائياً
    async function checkUserSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      const profileBadge = document.getElementById('profile-badge');
      const usernameDisplay = document.getElementById('username-display');
      const userAvatar = document.getElementById('user-avatar');
      const authBtn = document.getElementById('auth-btn');

      if (session && session.user) {
        const userId = session.user.id;
        
        // جلب الـ username وصورة البروفايل من جدول profiles
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('username, avatar_url')
          .eq('id', userId)
          .single();

        if (profile) {
          usernameDisplay.textContent = profile.username || session.user.email.split('@')[0];
          userAvatar.src = profile.avatar_url || 'https://www.w3schools.com/howto/img_avatar.png';
        } else {
          usernameDisplay.textContent = session.user.email.split('@')[0];
          userAvatar.src = 'https://www.w3schools.com/howto/img_avatar.png';
        }

        profileBadge.style.display = 'flex';
        authBtn.textContent = 'تسجيل الخروج';
        authBtn.style.backgroundColor = '#ef4444';
        authBtn.style.color = 'white';
        authBtn.onclick = handleSignOut;
      } else {
        profileBadge.style.display = 'none';
        authBtn.textContent = 'تسجيل الدخول';
        authBtn.style.backgroundColor = '#38bdf8';
        authBtn.style.color = '#0f172a';
        authBtn.onclick = openAuthModal;
      }
    }

    // دالة تسجيل الخروج
    async function handleSignOut() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    // دالة فتح مودل تسجيل الدخول (يمكنك ربطها بنافذتك الحالية)
    function openAuthModal() {
      alert('قم بربط هذه الدالة بنافذة Modal تسجيل الدخول الخاصة بك');
    }

    // التحقق عند تحميل الصفحة
    window.addEventListener('DOMContentLoaded', checkUserSession);
  </script>

</body>
</html>
