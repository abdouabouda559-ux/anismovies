<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أنيس موفيز - AnisMovies</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #334155;
      padding: 5px 12px 5px 5px;
      border-radius: 30px;
    }
    #avatar-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #475569;
    }
    #username-display {
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }
    #auth-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #auth-btn.login {
      background-color: #38bdf8;
      color: #0f172a;
    }
    .container {
      padding: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">أنيس موفيز 🎬</div>
    <div class="user-info">
      <div class="user-profile" id="profile-container">
        <img id="avatar-img" src="https://via.placeholder.com/150" alt="صورة البروفايل">
        <span id="username-display">جاري التحميل...</span>
      </div>
      <button id="auth-btn" onclick="handleAuthAction()">تسجيل الخروج</button>
    </div>
  </header>

  <div class="container">
    <h1>مرحباً بك في منصة الأفلام والمسلسلات</h1>
    <p>استمتع بأحدث الأعمال والمحتوى المميز.</p>
  </div>

  <script>
    // إعدادات اتصال Supabase الخاصة بك
    const SUPABASE_URL = 'https://oebxbywghooghwetpx.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // ضع مفتاح الـ Anon الخاص بك هنا
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkUserSession() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      const usernameSpan = document.getElementById('username-display');
      const avatarImg = document.getElementById('avatar-img');
      const profileContainer = document.getElementById('profile-container');
      const authBtn = document.getElementById('auth-btn');

      if (session && session.user) {
        const userId = session.user.id;
        profileContainer.style.display = 'flex';

        // جلب اسم المستخدم وصورة البروفايل من جدول profiles
        const { data: profile, error: profileError } = await supabaseClient
          .from('profiles')
          .select('username, avatar_url')
          .eq('id', userId)
          .single();

        if (profile) {
          // عرض اسم المستخدم
          usernameSpan.textContent = profile.username || session.user.email.split('@')[0];
          
          // عرض صورة البروفايل إذا كانت موجودة، أو وضع صورة افتراضية
          if (profile.avatar_url) {
            avatarImg.src = profile.avatar_url;
          } else {
            avatarImg.src = 'https://www.w3schools.com/howto/img_avatar.png'; // صورة افتراضية جاهزة
          }
        } else {
          usernameSpan.textContent = session.user.email.split('@')[0];
          avatarImg.src = 'https://www.w3schools.com/howto/img_avatar.png';
        }

        authBtn.textContent = 'تسجيل الخروج';
        authBtn.className = '';
      } else {
        profileContainer.style.display = 'none'; // إخفاء البروفايل في حال لم يكن مسجلاً
        authBtn.textContent = 'تسجيل الدخول';
        authBtn.className = 'login';
      }
    }

    async function handleAuthAction() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        // تسجيل الخروج
        await supabaseClient.auth.signOut();
        window.location.reload();
      } else {
        // توجيه لصفحة تسجيل الدخول أو فتح المودل الخاص بك
        alert('يرجى فتح نافذة تسجيل الدخول');
      }
    }

    // تنفيذ التحقق عند تحميل الصفحة
    window.onload = checkUserSession;
  </script>

</body>
</html>
