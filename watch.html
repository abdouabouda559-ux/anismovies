<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أنيس موفيز - مشاهدة الفيلم</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 15px;
      z-index: 100;
      width: calc(100% - 40px);
      max-width: 1200px;
      margin: 15px auto 0 auto;
      border-radius: 14px;
      border: 1px solid rgba(51, 65, 85, 0.5);
    }

    .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
    .back-home { background-color: rgba(30, 41, 59, 0.6); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 0.4rem 1rem; border-radius: 8px; font-size: 0.85rem; }

    .watch-container { max-width: 1100px; width: calc(100% - 40px); margin: 2rem auto; flex: 1; display: flex; flex-direction: column; gap: 1.5rem; }
    .player-box { width: 100%; aspect-ratio: 16/9; background-color: #1e293b; border-radius: 16px; overflow: hidden; border: 1px solid #334155; }
    .player-box iframe { width: 100%; height: 100%; border: none; }

    .servers-section { background-color: #1e293b; padding: 1.2rem 1.5rem; border-radius: 14px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 0.8rem; }
    .servers-title { font-size: 1rem; color: #94a3b8; }
    .servers-buttons { display: flex; gap: 1rem; }
    .server-btn { background-color: #0f172a; color: #cbd5e1; border: 1px solid #334155; padding: 0.6rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .server-btn.active, .server-btn:hover { background-color: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    .movie-details { background-color: #1e293b; padding: 1.5rem; border-radius: 14px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 0.6rem; }
    .movie-title-large { font-size: 1.6rem; color: #fff; }
    .movie-meta-info { display: flex; gap: 1.5rem; font-size: 0.9rem; color: #94a3b8; }
    .movie-desc { font-size: 0.95rem; color: #cbd5e1; line-height: 1.6; }

    footer { background-color: #1e293b; text-align: center; padding: 1.5rem; border-top: 1px solid #334155; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <div class="logo">أنيس موفيز</div>
    <a href="index.html" class="back-home">الرئيسية ←</a>
  </header>

  <div class="watch-container">
    <div class="player-box">
      <iframe id="videoPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>

    <!-- السيرفرات بحد أقصى سيرفرين كما طلبت -->
    <div class="servers-section">
      <span class="servers-title">اختر سيرفر المشاهدة:</span>
      <div class="servers-buttons">
        <button class="server-btn active" onclick="changeServer('https://www.youtube.com/embed/dQw4w9WgXcQ', this)">السيرفر الرئيسي (1)</button>
        <button class="server-btn" onclick="changeServer('https://www.dailymotion.com/embed/video/x8om2p8', this)">السيرفر الاحتياطي (2)</button>
      </div>
    </div>

    <div class="movie-details">
      <h1 class="movie-title-large">رحلة الفضاء المجهولة</h1>
      <div class="movie-meta-info">
        <span>السنة: 2024</span>
        <span>التصنيف: خيال علمي</span>
      </div>
      <p class="movie-desc">تدور أحداث الفيلم حول رحلة استكشافية مذهلة في الفضاء العميق.</p>
    </div>
  </div>

  <footer>
    <p>لمشاهدة المزيد من المحتوى، زر موقعنا anismovies.iceiy.com. جميع الحقوق محفوظة &copy; 2026</p>
  </footer>

  <script>
    function changeServer(url, btn) {
      document.getElementById('videoPlayer').src = url;
      document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
