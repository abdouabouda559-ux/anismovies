<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاهدة الفيلم - أنيس موفيز</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Header */
    header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 15px;
      z-index: 100;
      width: calc(100% - 40px);
      max-width: 1200px;
      margin: 15px auto 0 auto;
      border-radius: 14px;
      border: 1px solid rgba(51, 65, 85, 0.5);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .back-btn {
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background-color: #38bdf8;
      color: #0f172a;
    }

    /* Watch Container */
    .watch-container {
      width: calc(100% - 40px);
      max-width: 1200px;
      margin: 2rem auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .video-player-box {
      width: 100%;
      aspect-ratio: 16/9;
      background-color: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-player-box iframe, 
    .video-player-box video {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: cover;
    }

    .movie-details-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .movie-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .movie-title {
      font-size: 1.8rem;
      color: #ffffff;
      font-weight: bold;
    }

    .action-watchlist-btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .action-watchlist-btn:hover {
      background-color: #0ea5e9;
    }

    .movie-meta-info {
      display: flex;
      gap: 1.5rem;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .movie-description {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 1rem;
    }

    footer {
      background-color: #1e293b;
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid #334155;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">أنيس موفيز</div>
    <a href="index.html" class="back-btn">العودة للرئيسية</a>
  </header>

  <!-- Watch Main Content -->
  <div class="watch-container">
    <!-- مشغل الفيديو -->
    <div class="video-player-box" id="playerContainer">
      <p style="color: #94a3b8;">جاري تحميل سيرفر المشاهدة...</p>
    </div>

    <!-- تفاصيل الفيلم -->
    <div class="movie-details-card">
      <div class="movie-header-row">
        <h1 class="movie-title" id="movieTitle">جاري التحميل...</h1>
        <button class="action-watchlist-btn" id="watchlistBtn" onclick="handleWatchlistToggle()">
          ❤️ إضافة لقائمة المشاهدة
        </button>
      </div>
      <div class="movie-meta-info">
        <span id="movieYear">السنة: --</span>
        <span id="movieCategory">التصنيف: --</span>
        <span id="movieRating">التقييم: ★ --</span>
      </div>
      <p class="movie-description" id="movieDescription">جاري جلب تفاصيل وقصة الفيلم...</p>
    </div>
  </div>

  <footer>
    <p>لمشاهدة المزيد من المحتوى، زر موقعنا anismovies.iceiy.com. جميع الحقوق محفوظة &copy; 2026</p>
  </footer>

  <!-- Supabase CDN & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    // استخراج معرّف الفيلم (id) من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    let currentMovieData = null;

    async function loadMovieDetails() {
      if (!movieId) {
        document.querySelector('.watch-container').innerHTML = '<p style="text-align:center; color:#f87171; padding:3rem;">عذراً، لم يتم تحديد الفيلم المطلوب.</p>';
        return;
      }

      try {
        const { data: movie, error } = await supabaseClient
          .from('movies')
          .select('*')
          .eq('id', movieId)
          .single();

        if (error || !movie) {
          throw new Error('الفيلم غير موجود أو تم حذفه.');
        }

        currentMovieData = movie;

        // تعبئة البيانات في الصفحة
        document.getElementById('movieTitle').textContent = movie.title;
        document.getElementById('movieYear').textContent = `السنة: ${movie.release_year || 'غير محدد'}`;
        document.getElementById('movieCategory').textContent = `التصنيف: ${movie.category || 'عام'}`;
        document.getElementById('movieRating').textContent = `التقييم: ★ ${movie.rating || 'N/A'}`;
        document.getElementById('movieDescription').textContent = movie.description || 'لا توجد قصة متاحة لهذا الفيلم حالياً.';

        // عرض مشغل الفيديو (سيرفر المشاهدة)
        const playerContainer = document.getElementById('playerContainer');
        if (movie.video_url) {
          // إذا كان الرابط iframe أو رابط مباشر
          if (movie.video_url.includes('<iframe') || movie.video_url.startsWith('http')) {
            if (movie.video_url.includes('<iframe')) {
              playerContainer.innerHTML = movie.video_url;
            } else {
              playerContainer.innerHTML = `<iframe src="${movie.video_url}" allowfullscreen></iframe>`;
            }
          } else {
            playerContainer.innerHTML = `<video src="${movie.video_url}" controls autoplay></video>`;
          }
        } else {
          playerContainer.innerHTML = '<p style="color: #f87171;">عذراً، سيرفر المشاهدة غير متوفر حالياً.</p>';
        }

      } catch (err) {
        console.error('Error loading movie:', err.message);
        document.querySelector('.watch-container').innerHTML = `<p style="text-align:center; color:#f87171; padding:3rem;">حدث خطأ أثناء تحميل الفيلم: ${err.message}</p>`;
      }
    }

    // دالة تفاعلية لإضافة أو إزالة الفيلم من قائمة المشاهدة من داخل صفحة العرض
    async function handleWatchlistToggle() {
      if (!movieId) return;
      if (typeof toggleWatchlist === 'function') {
        await toggleWatchlist(parseInt(movieId));
      }
    }

    // حماية الصفحة ضد فحص العناصر أو النسخ
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
        e.preventDefault();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadMovieDetails();
    });
  </script>
</body>
</html>
